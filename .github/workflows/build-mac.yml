name: Build macOS Installer Package

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pywebview pyinstaller pillow pyobjc-framework-Cocoa pyobjc-framework-WebKit

      - name: Build macOS App & DMG Installer
        run: |
          python build_mac.py

      - name: Compress App Bundle for Artifact Upload
        run: |
          cd dist
          zip -r "PeriFerry_Employee_Portal_macOS_App.zip" "PeriFerry Employee Portal.app"

      - name: Upload macOS DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeriFerry-Employee-Portal-macOS-DMG
          path: dist/PeriFerry Employee Portal.dmg

      - name: Upload macOS App Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeriFerry-Employee-Portal-macOS-App
          path: dist/PeriFerry_Employee_Portal_macOS_App.zip
