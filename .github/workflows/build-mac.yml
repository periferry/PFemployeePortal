name: Build macOS Installer Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pywebview pyinstaller pillow

      - name: Build macOS App & DMG Installer
        run: |
          python build_mac.py

      - name: Upload macOS DMG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeriFerry-Employee-Portal-macOS
          path: dist/PeriFerry Employee Portal.dmg
